<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Vestrix</title>
  <desc id="d">AI wrote it. See how it flows. Interactive call graphs and data-flow tracing for Python.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1f2b45"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4a6b"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a1a"/></marker>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- left: brand -->
  <g transform="translate(96 150) scale(1.6)">
    <rect width="64" height="64" rx="15" fill="url(#cf-bg)"/>
    <path d="M15.5 17Q19.5 38 32 47" fill="none" stroke="#dbe7ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 47Q44.5 38 48.5 17" fill="none" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15.5" cy="17" r="5" fill="#dbe7ff"/>
    <circle cx="32" cy="47" r="5.5" fill="#ffffff"/>
    <circle cx="48.5" cy="17" r="7.5" fill="#ff7a1a"/>
    <circle cx="48.5" cy="17" r="2.8" fill="#ffffff"/>
  </g>
  <text x="222" y="222" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2"><tspan fill="#f1f5f9">vestri</tspan><tspan fill="#ff8a3d">x</tspan></text>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="336" font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="-1.2">AI wrote it.</text>
    <text x="96" y="400" font-size="54" font-weight="700" fill="#ff8a3d" letter-spacing="-1.2">See how it flows.</text>
    <text x="96" y="462" font-size="24" fill="#9fb0cc">Trace values, untangle calls and catch circular imports in Python.</text>
    <text x="96" y="496" font-size="24" fill="#9fb0cc">Offline · zero dependencies · nothing leaves your machine.</text>
    <text x="96" y="572" font-size="20" fill="#5f7396" font-family="'Cascadia Code', Consolas, ui-monospace, monospace">$ vestrix ui</text>
  </g>

  <!-- right: a traced value moving through a call graph -->
  <g font-family="'Cascadia Code', Consolas, ui-monospace, monospace" font-size="17">
    <g fill="none" stroke="#3a4a6b" stroke-width="2.2" marker-end="url(#a)">
      <path d="M958 144 C1004 144 1000 238 1044 238"/>
      <path d="M958 150 C1004 150 1000 330 1044 330"/>
    </g>
    <g fill="none" stroke="#ff7a1a" stroke-width="3.2" marker-end="url(#ah)" stroke-linecap="round">
      <path d="M822 212 C822 176 834 150 860 150"/>
      <path d="M958 158 C1004 158 996 420 1044 420"/>
      <path d="M1142 421 H1184"/>
    </g>
    <!-- nodes -->
    <g>
      <rect x="742" y="214" width="160" height="46" rx="23" fill="#1d2b47" stroke="#6ea0ff" stroke-width="2"/>
      <text x="822" y="243" fill="#dbe7ff" text-anchor="middle">body</text>
      <rect x="862" y="127" width="96" height="46" rx="8" fill="#15203a" stroke="#ff7a1a" stroke-width="2.2"/>
      <text x="910" y="156" fill="#f1f5f9" text-anchor="middle">route</text>
      <rect x="1046" y="215" width="150" height="46" rx="8" fill="#15203a" stroke="#34466b" stroke-width="1.6"/>
      <text x="1121" y="244" fill="#9fb0cc" text-anchor="middle">validate()</text>
      <rect x="1046" y="307" width="96" height="46" rx="8" fill="#15203a" stroke="#34466b" stroke-width="1.6"/>
      <text x="1094" y="336" fill="#9fb0cc" text-anchor="middle">auth()</text>
      <rect x="1046" y="397" width="96" height="46" rx="8" fill="#2b1c10" stroke="#ff7a1a" stroke-width="2.2"/>
      <text x="1094" y="426" fill="#ffd2b0" text-anchor="middle">price</text>
      <rect x="1186" y="398" width="72" height="46" rx="23" fill="#ff7a1a"/>
      <text x="1222" y="427" fill="#1a0f06" text-anchor="middle" font-weight="700">tax</text>
    </g>
  </g>
</svg>
