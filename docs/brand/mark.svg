<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Vestrix</title>
  <!-- A "V" drawn as a flow path: a value enters the code (white), reaches a call (vertex) and its traced path
       comes back out (orange = the Trace highlight in the app). -->
  <defs>
    <linearGradient id="vx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vx-bg)"/>
  <path d="M15.5 17Q19.5 38 32 47" fill="none" stroke="#dbe7ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M32 47Q44.5 38 48.5 17" fill="none" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="15.5" cy="17" r="5" fill="#dbe7ff"/>
  <circle cx="32" cy="47" r="5.5" fill="#ffffff"/>
  <circle cx="48.5" cy="17" r="7.5" fill="#ff7a1a"/>
  <circle cx="48.5" cy="17" r="2.8" fill="#ffffff"/>
</svg>
