<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>codeflow · sample_shop</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--ink:#1d1d1b;--muted:#6c6c66;--line:#e3e2dc;
  --accent:#2f6fdb;--accent-soft:#e4edfc;--node:#ffffff;--node-line:#c8c7c0;--edge:#a6a59e;
  --hl:#e8590c;--hl-soft:#fff1e7;--param:#e4edfc;--ret:#e3f5e8;--ret-line:#2f9e44;
  --callin:#fff5d9;--callin-line:#d19c00;--ext:#f0f0ed;--code-bg:#fafaf8;
  --kw:#8a3ffc;--str:#1a7f37;--com:#8b8b85;--num:#b35900;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161615;--panel:#1f1f1d;--ink:#ebebe6;--muted:#9c9c95;--line:#34342f;
  --accent:#6ea0ff;--accent-soft:#1d2b47;--node:#262624;--node-line:#4b4b45;--edge:#6e6e67;
  --hl:#ff8c42;--hl-soft:#3b2515;--param:#1d2b47;--ret:#15301d;--ret-line:#51cf66;
  --callin:#3a3013;--callin-line:#e0b400;--ext:#2a2a28;--code-bg:#1a1a18;
  --kw:#c29bff;--str:#7ee2a8;--com:#78786f;--num:#ffb870;color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:13px/1.45 var(--font);color:var(--ink);background:var(--bg);display:grid;
  grid-template-columns:260px minmax(0,1fr) 410px;grid-template-rows:52px minmax(0,1fr);
  grid-template-areas:"top top top" "side stage panel";height:100vh;overflow:hidden}
header{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{font-weight:650;font-size:15px;white-space:nowrap}
.logo{color:var(--accent);margin-right:2px}
.muted{color:var(--muted);font-weight:400}
.mono{font-family:var(--mono)}
#tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
#tabs button{border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
#tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
kbd{font:10px var(--mono);color:var(--muted);margin-left:4px}
.search{position:relative;flex:1;max-width:420px;min-width:160px}
#q{width:100%;font:13px var(--font);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent)}
#results{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:60vh;overflow:auto;z-index:30}
.res{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.res.on,.res:hover{background:var(--accent-soft)}
#stats{margin-left:auto;white-space:nowrap;font-size:12px;overflow:hidden;text-overflow:ellipsis}
#side{grid-area:side;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 40px}
#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0}
#canvas{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
#canvas.dragging{cursor:grabbing}
#toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5;pointer-events:none}
#toolbar>*{pointer-events:auto}
.grp{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:12px}
.grp .lbl{color:var(--muted)}
.note{color:var(--muted)}
.warn{color:var(--hl)}
#pathIn{font:12px var(--font);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--bg);color:var(--ink);width:200px}
button.b{font:12px var(--font);padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
button.b:hover,a.b:hover{border-color:var(--accent)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.sm{padding:0 7px;line-height:18px}
a.b{font:12px var(--font);padding:4px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
#zoomctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
#legend{position:absolute;left:10px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:calc(100% - 150px)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1.5px solid}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none;padding:24px;text-align:center}
/* graph */
.node rect.bg{fill:var(--node);stroke:var(--node-line);stroke-width:1}
.node text{font:12px var(--mono);fill:var(--ink)}
.node text.sub{font:10px var(--font);fill:var(--muted)}
.node{cursor:pointer}
.node:hover rect.bg{stroke:var(--accent)}
.node.focus rect.bg{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
.node.klass rect.bg{stroke-dasharray:4 2}
.node.ext rect.bg{fill:var(--ext);stroke-dasharray:3 3}
.node.ext text{fill:var(--muted)}
.node.param rect.bg{fill:var(--param);stroke:var(--accent)}
.node.ret rect.bg{fill:var(--ret);stroke:var(--ret-line)}
.node.callin rect.bg{fill:var(--callin);stroke:var(--callin-line)}
.node.callext rect.bg{fill:var(--ext)}
.node.attr rect.bg{stroke:var(--kw);stroke-dasharray:4 2}
.node.mark rect.bg{stroke:var(--hl);stroke-width:2;fill:var(--hl-soft)}
.node.sel rect.bg{stroke:var(--hl);stroke-width:2.5}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;marker-end:url(#arr)}
.edge.param{stroke-dasharray:6 3}
.edge.return{stroke-dasharray:2 3}
.edge.ext{stroke-dasharray:3 3;opacity:.7}
.edge.mark{stroke:var(--hl);stroke-width:2.4;marker-end:url(#arr-hl)}
.edge.hot{stroke:var(--accent);stroke-width:2.2;marker-end:url(#arr-hot)}
.arrow{fill:var(--edge)}.arrow.hl{fill:var(--hl)}.arrow.hot{fill:var(--accent)}
.elabel{font:10px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
#canvas.hovering .node:not(.hot){opacity:.28}
#canvas.hovering .edge:not(.hot),#canvas.hovering .elabel:not(.hot){opacity:.12}
/* side */
#side h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
#side h3:first-of-type{margin-top:12px}
#filter{width:100%;font:12px var(--font);padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.item{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--ink);text-decoration:none}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent-soft)}
.item .nm{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .muted{font-size:11px;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details summary{cursor:pointer;padding:3px 2px;font:12px var(--mono)}
details .item{margin-left:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.subh{font-size:11px;color:var(--muted);margin:8px 0 2px}
/* panel */
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);word-break:break-all}
#panel h2{font-size:17px;margin:2px 0 8px;word-break:break-word}
#panel h4{font-size:11px;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;letter-spacing:.05em}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:0 4px 4px 0}
.badge.entry{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge.warn{border-color:var(--hl);color:var(--hl)}
pre.sig{font:12px var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:8px 0}
.doc{margin:6px 0;color:var(--ink)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.lst li .muted{font-size:11px;text-align:right}
a.lnk,.lst a{color:var(--accent);cursor:pointer;font:12px var(--mono);text-decoration:none;word-break:break-all}
a.lnk:hover,.lst a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font:11px var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--bg)}
.chip[data-sel]{cursor:pointer}.chip[data-sel]:hover{border-color:var(--hl)}
.chip.param{border-color:var(--accent)}.chip.ret{border-color:var(--ret-line)}.chip.callin{border-color:var(--callin-line)}.chip.attr{border-color:var(--kw)}
pre.code{font:12px/1.55 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:6px 0;overflow:auto;max-height:440px;margin:0}
.ln{display:flex;white-space:pre;padding-right:12px}
.ln.hl{background:var(--hl-soft)}
.ln .no{width:44px;flex:none;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.n{color:var(--num)}
mark{background:var(--accent-soft);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--accent)}
.journey{padding-left:20px;margin:8px 0}
.journey li{margin-bottom:10px}
.steps{list-style:none;padding:0;margin:6px 0;font:12px var(--mono)}
.steps li{padding:3px 0;border-left:2px solid var(--line);padding-left:10px}
.steps .muted{font-family:var(--font);font-size:11px}
.empty-note{color:var(--muted);font-style:italic}
button.b.folder{max-width:260px;font-weight:600;gap:6px}
button.b.folder span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib{cursor:pointer}.lib.fw{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(760px,100%);max-height:min(720px,calc(100vh - 32px));display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:15px}
#pkBody{display:flex;flex-direction:column;min-height:0;flex:1}
.pk-bar{display:flex;gap:6px;padding:12px 16px 6px}
#pkPath{flex:1;min-width:0;font:13px var(--mono);padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pk-quick{display:flex;flex-wrap:wrap;gap:4px;padding:4px 16px 8px}
.pk-quick .chip{cursor:pointer}.pk-quick .chip:hover{border-color:var(--accent)}
.pk-quick .lbl{font-size:11px;color:var(--muted);align-self:center;margin:0 2px 0 6px}
.pk-here{margin:0 16px 8px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.pk-here b{font-size:13px}
.pk-list{overflow:auto;flex:1;min-height:120px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pk-row{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.pk-row:hover{background:var(--accent-soft)}
.pk-row .nm{font:12px var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-row.dim{opacity:.55}
.pk-row .badge{margin:0}
.pk-row .go{visibility:hidden}.pk-row:hover .go{visibility:visible}
.dlg-f{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;font-size:12px}
.dlg-f .sp{flex:1}
.pk-ex input{font:12px var(--font);padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:200px;margin-left:4px}
.lc{padding:4px 16px 16px;overflow:auto}
.lc section{padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lc h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lc p{margin:6px 0 0;font-size:12px}
#lcPath{flex:1;min-width:0;font:13px var(--mono);padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lc-status{margin-top:12px;font-size:12px;line-height:1.6;min-height:1em}
.lc-status.warn{color:var(--hl)}
.static-note{padding:16px;line-height:1.6}
.static-note code{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
@media (max-width:1000px){
  body{grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto;grid-template-areas:"top" "stage" "panel" "side";height:auto;overflow:auto}
  header{flex-wrap:wrap;padding:8px 16px;gap:8px}
  #stats{margin-left:0;width:100%}
  #panel,#side{border:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">&#9671;</span>codeflow</div>
  <button class="b folder" id="openBtn" title="Open another folder (O)"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span id="proj">Open folder</span></button>
  <nav id="tabs">
    <button data-view="calls">Calls<kbd>1</kbd></button>
    <button data-view="flow">Data flow<kbd>2</kbd></button>
    <button data-view="trace">Trace<kbd>3</kbd></button>
    <button data-view="modules">Modules<kbd>4</kbd></button>
  </nav>
  <div class="search"><input id="q" placeholder="Search functions…   ( / )" autocomplete="off" spellcheck="false"><div id="results" hidden></div></div>
  <div id="stats" class="muted"></div>
</header>
<aside id="side">
  <input id="filter" placeholder="Filter modules & functions…" spellcheck="false">
  <h3>Detected</h3><div id="detected"></div>
  <h3>Entry points</h3><div id="entries"></div>
  <h3>Insights</h3><div id="insights"></div>
  <h3>Modules</h3><div id="tree"></div>
</aside>
<main id="stage">
  <div id="toolbar"></div>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="arrow"/></marker>
      <marker id="arr-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="arrow hl"/></marker>
      <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="arrow hot"/></marker>
    </defs>
    <g id="viewport"><g id="edges"></g><g id="elabels"></g><g id="nodes"></g></g>
  </svg>
  <div id="empty" hidden></div>
  <div id="legend"></div>
  <div id="zoomctl"><button class="b" data-z="rot" title="Rotate layout (R)">&#8635; Rotate</button><button class="b" data-z="in" title="Zoom in">+</button><button class="b" data-z="out" title="Zoom out">&minus;</button><button class="b" data-z="fit" title="Fit (F)">Fit</button></div>
</main>
<aside id="panel"></aside>
<datalist id="fnlist"></datalist>
<div id="picker" class="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <div class="dlg-h"><h3 id="pkTitle">Open a project folder</h3><button class="b sm" id="pkClose" title="Close (Esc)">&#10005;</button></div>
    <div id="pkBody">
      <div class="pk-bar">
        <button class="b" id="pkUp" title="Parent folder">&#8593;</button>
        <input id="pkPath" spellcheck="false" placeholder="Type or paste a folder path, e.g. D:\Project\RangeBreak">
        <button class="b" id="pkGo">Go</button>
        <button class="b" id="pkNative" title="Use the Windows / macOS folder dialog">Browse&hellip;</button>
      </div>
      <div class="pk-quick" id="pkQuick"></div>
      <div class="pk-here" id="pkHere"></div>
      <div class="pk-list" id="pkList"></div>
      <div class="dlg-f">
        <label class="pk-ex">Skip folders <input id="pkEx" placeholder="e.g. tests, migrations" spellcheck="false"></label>
        <label><input type="checkbox" id="pkHidden"> Show hidden</label>
        <span class="sp"></span>
        <button class="b pri" id="pkOpen">Analyze this folder</button>
      </div>
    </div>
  </div>
</div>
<script id="cf-analyzer" type="application/json">"\"\"\"\ncodeflow.analyzer - static analysis of a Python codebase into:\n\n  * a call graph        (which function calls which, resolved across modules)\n  * local data flow     (inside each function: params -> variables -> calls -> return)\n  * global data flow    (the same, stitched across calls: argument -> callee param,\n                         callee return -> caller, and self.<attr> shared across methods)\n\nNothing is executed; everything comes from the `ast` module.\n\"\"\"\nfrom __future__ import annotations\n\nimport ast\nimport builtins\nimport sys\nimport time\nfrom collections import defaultdict, deque\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\nfrom types import SimpleNamespace\n\n__all__ = [\"Project\", \"Func\", \"Call\"]\nVERSION = \"0.2.0\"\n\nSKIP_DIRS = {\".git\", \".hg\", \".svn\", \"venv\", \".venv\", \"env\", \".env\", \"__pycache__\", \"node_modules\",\n             \"build\", \"dist\", \".tox\", \".nox\", \".mypy_cache\", \".pytest_cache\", \".ruff_cache\",\n             \"site-packages\", \".idea\", \".vscode\", \".eggs\"}\nSCOPE_TYPES = (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda)\nFUNC_TYPES = (ast.FunctionDef, ast.AsyncFunctionDef)\nMUTATORS = {\"append\", \"extend\", \"insert\", \"update\", \"add\", \"setdefault\", \"put\", \"push\", \"appendleft\"}\nBUILTINS = set(dir(builtins))\nROUTE_METHODS = {\"get\", \"post\", \"put\", \"delete\", \"patch\", \"head\", \"options\", \"route\", \"api_route\", \"websocket\"}\nTASK_DECOS = {\"task\", \"shared_task\", \"periodic_task\", \"job\", \"actor\"}\nCLI_DECOS = {\"command\", \"group\", \"callback\"}\nBRANCHES = tuple(t for t in (ast.If, ast.For, ast.AsyncFor, ast.While, ast.IfExp, ast.ExceptHandler,\n                             ast.comprehension, getattr(ast, \"match_case\", None)) if t)\nMAX_FILE_CHARS = 400_000\n\n\n# ============================================================================ model\n@dataclass\nclass Call:\n    text: str                       # callee as written, e.g. \"self.repo.save\"\n    line: int\n    args: list                      # [{\"star\": bool, \"src\": [local node ids]}]\n    kwargs: dict                    # name -> [local node ids]\n    resolved: str | None = None     # project qualname (function or class) or None if external\n    bindings: list = field(default_factory=list)   # [([src ids], callee_param)]\n\n    @property\n    def node(self):\n        return f\"call:{self.text}@{self.line}\"\n\n\n@dataclass\nclass Func:\n    qual: str\n    name: str\n    module: str\n    file: str\n    line: int\n    end: int\n    cls: str | None\n    kind: str                       # \"function\" | \"method\" | \"module\"\n    pos_params: list\n    kw_params: list\n    vararg: str | None\n    kwarg: str | None\n    decorators: list\n    doc: str\n    is_async: bool\n    entry: dict | None\n    complexity: int\n    calls: list = field(default_factory=list)\n    flows: list = field(default_factory=list)   # [(src, dst, label)] local node ids\n    types: dict = field(default_factory=dict)   # var -> call text that produced it\n\n    @property\n    def params(self):\n        return (self.pos_params + ([f\"*{self.vararg}\"] if self.vararg else []) + self.kw_params\n                + ([f\"**{self.kwarg}\"] if self.kwarg else []))\n\n    @property\n    def param_names(self):\n        return self.pos_params + [x for x in (self.vararg,) if x] + self.kw_params + [x for x in (self.kwarg,) if x]\n\n\n@dataclass\nclass Module:\n    name: str\n    file: str\n    is_pkg: bool\n    text: str\n    aliases: dict = field(default_factory=dict)\n    top_names: set = field(default_factory=set)\n\n\n# ============================================================================ AST helpers\ndef dotted(node):\n    \"\"\"a.b.c -> 'a.b.c'; f().g -> 'f().g'; anything else -> None.\"\"\"\n    parts = []\n    while isinstance(node, ast.Attribute):\n        parts.append(node.attr)\n        node = node.value\n    if isinstance(node, ast.Name):\n        parts.append(node.id)\n    elif isinstance(node, ast.Call):\n        inner = dotted(node.func)\n        if inner is None:\n            return None\n        parts.append(inner + \"()\")\n    else:\n        return None\n    return \".\".join(reversed(parts))\n\n\ndef walk_local(nodes):\n    \"\"\"Walk nodes without entering nested functions/classes/lambdas.\"\"\"\n    stack = [n for n in nodes if not isinstance(n, SCOPE_TYPES)]\n    while stack:\n        n = stack.pop()\n        yield n\n        stack.extend(c for c in ast.iter_child_nodes(n) if not isinstance(c, SCOPE_TYPES))\n\n\ndef store_names(t):\n    if isinstance(t, ast.Name):\n        return [t.id]\n    if isinstance(t, ast.Attribute):\n        d = dotted(t)\n        return [d] if d and \"()\" not in d else []\n    if isinstance(t, (ast.Tuple, ast.List)):\n        return [n for e in t.elts for n in store_names(e)]\n    if isinstance(t, (ast.Starred, ast.Subscript)):\n        return store_names(t.value)\n    return []\n\n\ndef sources(expr, ignore):\n    \"\"\"Direct inputs of an expression: (variable names, outermost Call nodes).\"\"\"\n    vars_, calls, stack = set(), [], [expr]\n    while stack:\n        n = stack.pop()\n        if isinstance(n, SCOPE_TYPES):\n            continue\n        if isinstance(n, ast.Call):\n            calls.append(n)                  # its inputs are recorded as edges into the call node\n            continue\n        if isinstance(n, ast.Attribute) and isinstance(n.ctx, ast.Load):\n            d = dotted(n)\n            if d and d.startswith(\"self.\") and \"()\" not in d:\n                vars_.add(d)\n                continue\n        if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load) and n.id not in ignore:\n            vars_.add(n.id)\n        stack.extend(ast.iter_child_nodes(n))\n    return sorted(vars_), calls\n\n\ndef call_text(c):\n    d = dotted(c.func)\n    if d:\n        return d\n    if isinstance(c.func, ast.Attribute):\n        return f\"(\u2026).{c.func.attr}\"\n    return \"<dynamic>\"\n\n\ndef call_id(c):\n    return f\"call:{call_text(c)}@{c.lineno}\"\n\n\ndef first_str_arg(call):\n    for a in call.args:\n        if isinstance(a, ast.Constant) and isinstance(a.value, str):\n            return a.value\n    return None\n\n\ndef deco_text(d):\n    if isinstance(d, ast.Call):\n        t = dotted(d.func) or \"?\"\n        s = first_str_arg(d)\n        return f'{t}(\"{s}\")' if s is not None else f\"{t}(\u2026)\"\n    return dotted(d) or \"?\"\n\n\ndef detect_entry(node):\n    for d in node.decorator_list:\n        target = d.func if isinstance(d, ast.Call) else d\n        t = dotted(target) or \"\"\n        last = t.rsplit(\".\", 1)[-1]\n        if \".\" in t and last in ROUTE_METHODS:\n            path = first_str_arg(d) if isinstance(d, ast.Call) else None\n            verb = \"ROUTE\" if last in (\"route\", \"api_route\") else last.upper()\n            return {\"kind\": \"route\", \"label\": f\"{verb} {path or ''}\".strip()}\n        if last in TASK_DECOS:\n            return {\"kind\": \"task\", \"label\": t}\n        if \".\" in t and last in CLI_DECOS:\n            return {\"kind\": \"cli\", \"label\": t}\n    if node.name.startswith(\"test_\"):\n        return {\"kind\": \"test\", \"label\": node.name}\n    if node.name == \"main\":\n        return {\"kind\": \"main\", \"label\": \"main()\"}\n    return None\n\n\ndef has_main_guard(tree):\n    for n in tree.body:\n        if isinstance(n, ast.If):\n            names = {x.id for x in ast.walk(n.test) if isinstance(x, ast.Name)}\n            consts = {x.value for x in ast.walk(n.test) if isinstance(x, ast.Constant)}\n            if \"__name__\" in names and \"__main__\" in consts:\n                return True\n    return False\n\n\ndef complexity(nodes):\n    c = 1\n    for n in walk_local(nodes):\n        if isinstance(n, BRANCHES):\n            c += 1\n        elif isinstance(n, ast.BoolOp):\n            c += len(n.values) - 1\n    return c\n\n\ndef build_func(node, qual, mod, cls, is_module=False):\n    if is_module:\n        pos, kw, va, ka, decos = [], [], None, None, []\n        entry = {\"kind\": \"main\", \"label\": f\"python {mod.file}\"} if has_main_guard(node) else None\n        line, end, name, kind, is_async = 1, max(1, mod.text.count(\"\\n\") + 1), \"<module>\", \"module\", False\n    else:\n        a = node.args\n        pos = [x.arg for x in a.posonlyargs + a.args]\n        kw = [x.arg for x in a.kwonlyargs]\n        va = a.vararg.arg if a.vararg else None\n        ka = a.kwarg.arg if a.kwarg else None\n        decos = [deco_text(d) for d in node.decorator_list]\n        entry = detect_entry(node)\n        line = min([d.lineno for d in node.decorator_list] + [node.lineno])\n        end = getattr(node, \"end_lineno\", node.lineno) or node.lineno\n        name, kind = node.name, (\"method\" if cls else \"function\")\n        is_async = isinstance(node, ast.AsyncFunctionDef)\n    doc = (ast.get_docstring(node) or \"\").strip().split(\"\\n\\n\")[0][:400]\n    f = Func(qual, name, mod.name, mod.file, line, end, cls, kind, pos, kw, va, ka, decos, doc,\n             is_async, entry, complexity(node.body))\n    ignore = (set(mod.aliases) | mod.top_names | BUILTINS | {\"self\", \"cls\"}) - set(f.param_names)\n\n    def src_ids(expr):\n        vs, cs = sources(expr, ignore)\n        return [f\"var:{v}\" for v in vs] + [call_id(c) for c in cs]\n\n    def link(expr, dst, label):\n        for s in src_ids(expr):\n            f.flows.append((s, dst, label))\n\n    for n in walk_local(node.body):\n        if isinstance(n, ast.Call):\n            cid = call_id(n)\n            args, kwargs = [], {}\n            for a in n.args:\n                star = isinstance(a, ast.Starred)\n                ids = src_ids(a.value if star else a)\n                args.append({\"star\": star, \"src\": ids})\n                for s in ids:\n                    f.flows.append((s, cid, \"*arg\" if star else \"arg\"))\n            for k in n.keywords:\n                ids = src_ids(k.value)\n                kwargs[k.arg or \"**\"] = ids\n                for s in ids:\n                    f.flows.append((s, cid, k.arg or \"**kw\"))\n            if isinstance(n.func, ast.Attribute):\n                owner = dotted(n.func.value)\n                if n.func.attr in MUTATORS and owner and \"()\" not in owner and owner not in ignore:\n                    f.flows.append((cid, f\"var:{owner}\", \"mutates\"))\n                else:\n                    link(n.func.value, cid, \"on\")\n            f.calls.append(Call(call_text(n), n.lineno, args, kwargs))\n        elif isinstance(n, (ast.Assign, ast.AnnAssign, ast.AugAssign)) and n.value is not None:\n            targets = n.targets if isinstance(n, ast.Assign) else [n.target]\n            names = [nm for t in targets for nm in store_names(t)]\n            for nm in names:\n                link(n.value, f\"var:{nm}\", \"=\")\n            if isinstance(n.value, ast.Call) and dotted(n.value.func):\n                for nm in names:\n                    f.types[nm] = dotted(n.value.func)\n        elif isinstance(n, ast.Return) and n.value is not None:\n            link(n.value, \"return\", \"return\")\n        elif isinstance(n, (ast.Yield, ast.YieldFrom)) and n.value is not None:\n            link(n.value, \"return\", \"yield\")\n        elif isinstance(n, (ast.For, ast.AsyncFor)):\n            for nm in store_names(n.target):\n                link(n.iter, f\"var:{nm}\", \"each\")\n        elif isinstance(n, (ast.With, ast.AsyncWith)):\n            for item in n.items:\n                if item.optional_vars is not None:\n                    for nm in store_names(item.optional_vars):\n                        link(item.context_expr, f\"var:{nm}\", \"as\")\n        elif isinstance(n, ast.NamedExpr):\n            link(n.value, f\"var:{n.target.id}\", \":=\")\n        elif isinstance(n, ast.comprehension):\n            for nm in store_names(n.target):\n                link(n.iter, f\"var:{nm}\", \"each\")\n    f.calls.sort(key=lambda c: c.line)\n    return f\n\n\n# ============================================================================ project\nclass Project:\n    def __init__(self, root, exclude=(), include_source=True):\n        self.root = Path(root).resolve()\n        if not self.root.exists():\n            raise FileNotFoundError(f\"path not found: {root}\")\n        self.base = self.root.parent if self.root.is_file() else self.root\n        self.exclude = set(exclude)\n        self.include_source = include_source\n        self.modules: dict[str, Module] = {}\n        self.funcs: dict[str, Func] = {}\n        self.classes: dict[str, dict] = {}\n        self.attr_types: dict[str, dict] = {}\n        self.module_types: dict[str, dict] = {}     # module -> {global var: constructor text}\n        self.errors: list[str] = []\n        t0 = time.perf_counter()\n        self._load()\n        self._link()\n        self.elapsed = time.perf_counter() - t0\n\n    # -- loading ----------------------------------------------------------------\n    def _files(self):\n        if self.root.is_file():\n            yield self.root\n            return\n        skip = SKIP_DIRS | self.exclude\n        for p in sorted(self.root.rglob(\"*.py\")):\n            if not any(part in skip for part in p.relative_to(self.root).parts):\n                yield p\n\n    def _load(self):\n        for path in self._files():\n            try:\n                text = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n                tree = ast.parse(text, filename=str(path))\n            except (SyntaxError, ValueError, OSError) as e:\n                self.errors.append(f\"{path.relative_to(self.base).as_posix()}: {e}\")\n                continue\n            parts = list(path.relative_to(self.base).with_suffix(\"\").parts)\n            is_pkg = parts[-1] == \"__init__\"\n            if is_pkg:\n                parts = parts[:-1]\n            name = \".\".join(parts) or self.base.name\n            mod = Module(name, path.relative_to(self.base).as_posix(), is_pkg, text)\n            self._imports(mod, tree)\n            mod.top_names = {n.name for n in tree.body if isinstance(n, (*FUNC_TYPES, ast.ClassDef))}\n            self.modules[name] = mod\n            top = build_func(tree, f\"{name}.<module>\", mod, None, is_module=True)\n            self.module_types[name] = {k: v for k, v in top.types.items() if \".\" not in k}\n            if top.calls:\n                self.funcs[top.qual] = top\n            self._collect(tree, name, mod, None)\n\n    def _imports(self, mod, tree):\n        pkg = mod.name.split(\".\") if mod.is_pkg else mod.name.split(\".\")[:-1]\n        for n in ast.walk(tree):\n            if isinstance(n, ast.Import):\n                for a in n.names:\n                    if a.asname:\n                        mod.aliases[a.asname] = a.name\n                    else:\n                        head = a.name.split(\".\")[0]\n                        mod.aliases[head] = head\n            elif isinstance(n, ast.ImportFrom):\n                if n.level:\n                    base = pkg[: max(0, len(pkg) - (n.level - 1))]\n                    src = \".\".join(base + ([n.module] if n.module else []))\n                else:\n                    src = n.module or \"\"\n                for a in n.names:\n                    if a.name != \"*\":\n                        mod.aliases[a.asname or a.name] = f\"{src}.{a.name}\" if src else a.name\n\n    def _collect(self, node, prefix, mod, cls):\n        for ch in ast.iter_child_nodes(node):\n            if isinstance(ch, FUNC_TYPES):\n                q = f\"{prefix}.{ch.name}\"\n                self.funcs[q] = build_func(ch, q, mod, cls)\n                if cls:\n                    self.classes[cls][\"methods\"].append(q)\n                self._collect(ch, q, mod, None)\n            elif isinstance(ch, ast.ClassDef):\n                q = f\"{prefix}.{ch.name}\"\n                self.classes[q] = {\"module\": mod.name, \"file\": mod.file, \"line\": ch.lineno, \"scope\": prefix,\n                                   \"bases_text\": [dotted(b) for b in ch.bases if dotted(b)],\n                                   \"bases\": [], \"methods\": [],\n                                   \"doc\": (ast.get_docstring(ch) or \"\").strip().split(\"\\n\\n\")[0][:400]}\n                self._collect(ch, q, mod, q)\n            elif isinstance(ch, ast.stmt):\n                self._collect(ch, prefix, mod, cls)\n\n    def _link(self):\n        for q, c in self.classes.items():\n            ctx = SimpleNamespace(module=c[\"module\"], qual=c[\"scope\"], cls=None, types={})\n            c[\"bases\"] = [r for r in (self._lookup(ctx, b) for b in c[\"bases_text\"]) if r in self.classes]\n        for f in self.funcs.values():\n            if f.cls:\n                for k, v in f.types.items():\n                    if k.startswith(\"self.\"):\n                        self.attr_types.setdefault(f.cls, {})[k] = v\n        for f in self.funcs.values():\n            for call in f.calls:\n                call.resolved = self.resolve(f, call.text)\n                if call.resolved in self.funcs:\n                    call.bindings = self._bind(f, call)\n\n    # -- resolution -------------------------------------------------------------\n    def _canonical(self, name):\n        \"\"\"Follow re-exports: pkg.Name where pkg/__init__ does `from .mod import Name`.\"\"\"\n        for _ in range(6):\n            if name in self.funcs or name in self.classes:\n                return name\n            parts = name.split(\".\")\n            for i in range(len(parts) - 1, 0, -1):\n                m = self.modules.get(\".\".join(parts[:i]))\n                if m and parts[i] in m.aliases:\n                    name = \".\".join([m.aliases[parts[i]]] + parts[i + 1:])\n                    break\n            else:\n                return name\n        return name\n\n    def _mro(self, cls_q):\n        seen, queue, out = set(), deque([cls_q]), []\n        while queue:\n            c = queue.popleft()\n            if c in seen or c not in self.classes:\n                continue\n            seen.add(c)\n            out.append(c)\n            queue.extend(self.classes[c][\"bases\"])\n        return out\n\n    def _member(self, cls_q, name):\n        for c in self._mro(cls_q):\n            if f\"{c}.{name}\" in self.funcs:\n                return f\"{c}.{name}\"\n        return None\n\n    def _attr_type(self, cls_q, obj):\n        for c in self._mro(cls_q):\n            t = self.attr_types.get(c, {}).get(obj)\n            if t:\n                return t\n        return None\n\n    def _lookup(self, ctx, text, depth=0):\n        if depth > 3 or not text or text.startswith(\"<\") or text.startswith(\"(\u2026)\"):\n            return None\n        if text.startswith(\"super().\"):\n            name = text[len(\"super().\"):]\n            if ctx.cls and \".\" not in name:\n                for b in self.classes.get(ctx.cls, {}).get(\"bases\", []):\n                    m = self._member(b, name)\n                    if m:\n                        return m\n            return None\n        if \"()\" in text:\n            return None\n        parts = text.split(\".\")\n        head, rest = parts[0], parts[1:]\n        mod = self.modules[ctx.module]\n        cands = []\n        if head in (\"self\", \"cls\") and ctx.cls:\n            cands.append(\".\".join([ctx.cls] + rest) if rest else ctx.cls)\n        cands.append(f\"{ctx.qual}.{text}\")\n        if head in mod.top_names or head in self.module_types.get(ctx.module, {}):\n            cands.append(f\"{ctx.module}.{text}\")\n        if head in mod.aliases:\n            cands.append(\".\".join([mod.aliases[head]] + rest))\n        for i in range(len(parts) - 1, 0, -1):          # x = Cls(); x.method()\n            obj = \".\".join(parts[:i])\n            typ = ctx.types.get(obj) or (self._attr_type(ctx.cls, obj) if ctx.cls else None)\n            if typ and typ != text:\n                tq = self._lookup(ctx, typ, depth + 1)\n                if tq:\n                    cands.append(\".\".join([tq] + parts[i:]))\n                break\n        for c in cands:\n            c = self._canonical(c)\n            if c in self.funcs or c in self.classes:\n                return c\n            owner, _, last = c.rpartition(\".\")\n            if owner in self.classes:\n                m = self._member(owner, last)\n                if m:\n                    return m\n            r = self._via_module_var(c, depth)\n            if r:\n                return r\n        return None\n\n    def _via_module_var(self, name, depth):\n        \"\"\"pkg.mod.router.post where `router = Router()` at module level -> Router.post.\"\"\"\n        parts = name.split(\".\")\n        for i in range(len(parts) - 1, 0, -1):\n            m = \".\".join(parts[:i])\n            if m not in self.modules:\n                continue\n            typ = self.module_types.get(m, {}).get(parts[i])\n            if not typ:\n                return None\n            mctx = SimpleNamespace(module=m, qual=f\"{m}.<module>\", cls=None, types=self.module_types[m])\n            tq = self._lookup(mctx, typ, depth + 1)\n            if tq and i + 1 < len(parts):\n                c = self._canonical(\".\".join([tq] + parts[i + 1:]))\n                if c in self.funcs or c in self.classes:\n                    return c\n                owner, _, last = c.rpartition(\".\")\n                if owner in self.classes:\n                    return self._member(owner, last)\n            return None\n        return None\n\n    def resolve(self, f, text):\n        \"\"\"Map call text to a project qualname, or None when external/unknown.\"\"\"\n        q = self._lookup(f, text)\n        if q in self.classes:\n            return self._member(q, \"__init__\") or q\n        return q\n\n    def _bind(self, f, call):\n        \"\"\"Map a call's arguments onto the callee's parameters.\"\"\"\n        g = self.funcs[call.resolved]\n        is_static = any(d.split(\"(\")[0].endswith(\"staticmethod\") for d in g.decorators)\n        is_classm = any(d.split(\"(\")[0].endswith(\"classmethod\") for d in g.decorators)\n        skip = g.kind == \"method\" and not is_static\n        owner = call.text.rpartition(\".\")[0]\n        if (skip and owner and owner not in (\"self\", \"cls\") and g.name != \"__init__\" and not is_classm\n                and not owner.startswith(\"super()\")):\n            if self._lookup(f, owner) in self.classes:\n                skip = False                      # Base.method(self, x): self passed explicitly\n        pos = g.pos_params[1:] if skip else list(g.pos_params)\n        out = []\n        for i, a in enumerate(call.args):\n            if a[\"star\"]:\n                break\n            if i < len(pos):\n                out.append((a[\"src\"], pos[i]))\n            elif g.vararg:\n                out.append((a[\"src\"], g.vararg))\n        for k, ids in call.kwargs.items():\n            if k != \"**\" and k in g.param_names:\n                out.append((ids, k))\n            elif g.kwarg:\n                out.append((ids, g.kwarg))\n        return [(ids, p) for ids, p in out if ids]\n\n    # -- graphs -----------------------------------------------------------------\n    def gid(self, q, local):\n        f = self.funcs[q]\n        if f.cls and local.startswith(\"var:self.\"):\n            return f\"{f.cls}::attr:{local[len('var:self.'):]}\"\n        return f\"{q}::{local}\"\n\n    def global_flows(self):\n        \"\"\"Whole-program value-flow edges: (src_gid, dst_gid, label, kind).\"\"\"\n        if hasattr(self, \"_gflows\"):\n            return self._gflows\n        out = []\n        returns = {q for q, f in self.funcs.items() if any(d == \"return\" for _, d, _ in f.flows)}\n        for q, f .handle_checkout::return","shop.web.checkout_endpoint::call:handle_checkout@8","returns","return"]],"files":{"main.py":"from shop import web  # noqa: F401  (registers routes)\nfrom shop.router import router\n\nif __name__ == \"__main__\":\n    request = {\"user_id\": 42, \"items\": [{\"sku\": \"a1 \", \"qty\": 2}, {\"sku\": \"B7\", \"qty\": 1}]}\n    print(router.dispatch(\"POST\", \"/checkout\", request))\n","shop/__init__.py":"from .api import handle_checkout\n\n__all__ = [\"handle_checkout\"]\n","shop/api.py":"from .service import CheckoutService\nfrom .validation import validate_request\n\n\ndef handle_checkout(request):\n    payload = validate_request(request)\n    service = CheckoutService()\n    order = service.checkout(payload[\"user_id\"], payload[\"items\"])\n    return {\"status\": \"ok\", \"order_id\": order[\"id\"], \"total\": order[\"total\"]}\n","shop/pricing.py":"TAX_RATE = 0.08\nPRICES = {\"A1\": 19.99, \"B7\": 5.50}\n\n\ndef price_items(items):\n    lines = []\n    for item in items:\n        unit = lookup_price(item[\"sku\"])\n        lines.append({\"sku\": item[\"sku\"], \"qty\": item[\"qty\"], \"subtotal\": apply_tax(unit * item[\"qty\"])})\n    return lines\n\n\ndef lookup_price(sku):\n    return PRICES.get(sku, 0.0)\n\n\ndef apply_tax(amount):\n    return round(amount * (1 + TAX_RATE), 2)\n","shop/repository.py":"import json\nimport uuid\n\n\nclass BaseRepository:\n    \"\"\"Shared persistence helpers.\"\"\"\n\n    def __init__(self):\n        self.rows = []\n\n    def _serialize(self, obj):\n        return json.dumps(obj, sort_keys=True)\n\n\nclass OrderRepository(BaseRepository):\n    \"\"\"Stores orders in memory (stand-in for a database).\"\"\"\n\n    def save(self, order):\n        order_id = uuid.uuid4().hex[:8]\n        record = self._serialize({\"id\": order_id, **order})\n        self.rows.append(record)\n        return order_id\n","shop/router.py":"class Router:\n    \"\"\"Tiny stand-in for a FastAPI/Flask router so the example runs with no dependencies.\"\"\"\n\n    def __init__(self):\n        self.routes = {}\n\n    def post(self, path):\n        def register(fn):\n            self.routes[(\"POST\", path)] = fn\n            return fn\n        return register\n\n    def dispatch(self, method, path, body):\n        handler = self.routes[(method, path)]\n        return handler(body)\n\n\nrouter = Router()\n","shop/service.py":"from .pricing import price_items\nfrom .repository import OrderRepository\n\n\nclass CheckoutService:\n    def __init__(self):\n        self.repo = OrderRepository()\n\n    def checkout(self, user_id, items):\n        priced = price_items(items)\n        total = round(sum(line[\"subtotal\"] for line in priced), 2)\n        order = {\"user_id\": user_id, \"lines\": priced, \"total\": total}\n        order_id = self.repo.save(order)\n        order[\"id\"] = order_id\n        return order\n","shop/validation.py":"def validate_request(request):\n    if \"user_id\" not in request or not request.get(\"items\"):\n        raise ValueError(\"user_id and items are required\")\n    items = [normalize_item(i) for i in request[\"items\"]]\n    return {\"user_id\": int(request[\"user_id\"]), \"items\": items}\n\n\ndef normalize_item(item):\n    return {\"sku\": item[\"sku\"].strip().upper(), \"qty\": max(1, int(item.get(\"qty\", 1)))}\n","shop/web.py":"from . import handle_checkout\nfrom .router import router\n\n\n@router.post(\"/checkout\")\ndef checkout_endpoint(body):\n    \"\"\"HTTP entry point: POST /checkout.\"\"\"\n    result = handle_checkout(body)\n    return {\"code\": 200, \"json\": result}\n"},"errors":[]}</script>

  const recent = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) { return []; } };
  const remember = p => { try { localStorage.setItem(KEY, JSON.stringify([p, ...recent().filter(x => x !== p)].slice(0, 8))); } catch (_) {} };
  if (D.meta.served && D.meta.name) remember(D.meta.root);
  const baseName = p => String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;
  function analyze(path) {
    if (!path) return;
    remember(path);
    const ex = $('#pkEx').value.split(',').map(s => s.trim()).filter(Boolean).join(',');
    $('#pkOpen').textContent = 'Analyzing…'; $('#pkOpen').disabled = true;
    location.href = '/?path=' + encodeURIComponent(path) + (ex ? '&exclude=' + encodeURIComponent(ex) : '');
  }
  async function load(path) {
    const my = ++seq;
    $('#pkList').innerHTML = '<p class="empty-note" style="padding:12px 16px">Reading folder…</p>';
    try {
      const r = await fetch('/api/ls?path=' + encodeURIComponent(path || ''));
      const j = await r.json();
      if (my !== seq) return;
      if (j.error) throw new Error(j.error);
      data = j; cur = j.path; draw();
    } catch (e) {
      if (my !== seq) return;
      $('#pkList').innerHTML = `<p class="warn" style="padding:12px 16px">${esc(e.message)}</p>`;
      $('#pkPath').value = path || '';
    }
  }
  function verdict(d) {
    const n = d.py_total + (d.py_capped ? '+' : '');
    if (!d.py_total) return `<b>No Python files here.</b> <span class="muted">Open one of the folders below.</span>`;
    const proj = d.marks.some(m => ['pyproject', 'setup.py', 'setup.cfg', 'requirements', 'uv', 'poetry', 'pipenv', 'django'].includes(m));
    return `<b>${n} Python file${d.py_total === 1 ? '' : 's'}</b> ${proj ? '· looks like a Python project' : d.marks.includes('package') ? '· Python package' : ''}
      <div class="chips">${d.marks.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>`;
  }
  function draw() {
    const d = data;
    $('#pkPath').value = d.path;
    const rec = recent().filter(p => p !== d.path);
    $('#pkQuick').innerHTML =
      d.drives.map(x => `<span class="chip" data-pk="${esc(x)}">${esc(x)}</span>`).join('') +
      `<span class="chip" data-pk="${esc(d.home)}">Home</span><span class="chip" data-pk="${esc(d.cwd)}" title="${esc(d.cwd)}">Current dir</span>` +
      (rec.length ? `<span class="lbl">Recent</span>` + rec.map(p => `<span class="chip" data-pk="${esc(p)}" title="${esc(p)}">${esc(baseName(p))}</span>`).join('') : '');
    $('#pkHere').innerHTML = verdict(d);
    const showHidden = $('#pkHidden').checked;
    const rows = d.dirs.filter(x => showHidden || !x.hidden);
    $('#pkList').innerHTML = rows.length ? rows.map(x => `
      <div class="pk-row ${x.skipped || x.denied ? 'dim' : ''}" data-pk="${esc(x.path)}" title="${esc(x.path)}">
        <span class="nm">${esc(x.name)}</span>
        ${x.skipped ? '<span class="badge">skipped by analyzer</span>' : ''}
        ${x.denied ? '<span class="badge">no access</span>' : ''}
        ${x.marks.map(m => `<span class="badge ${['pyproject', 'git', 'package'].includes(m) ? 'entry' : ''}">${esc(m)}</span>`).join('')}
        ${x.py ? `<span class="badge">${x.py} .py</span>` : ''}
        ${x.skipped || x.denied ? '' : `<button class="b sm go" data-an="${esc(x.path)}">Analyze</button>`}
      </div>`).join('') : '<p class="empty-note" style="padding:12px 16px">No sub-folders.</p>';
    $('#pkUp').disabled = !d.parent;
  }
  function open() {
    box.hidden = false;
    if (!D.meta.served) { Local.show(); return; }
    const root = D.meta.root || '';
    const start = D.meta.landing ? root : root.replace(/[\\/][^\\/]*[\\/]?$/, '') || root;
    $('#pkEx').value = (D.meta.exclude || []).join(', ');
    load(start);
    setTimeout(() => $('#pkPath').focus(), 30);
  }
  function close() { if (D.meta.landing) return; box.hidden = true; }
  box.addEventListener('click', e => {
    if (e.target === box) return close();
    const an = e.target.closest('[data-an]'); if (an) { e.stopPropagation(); return analyze(an.dataset.an); }
    const pk = e.target.closest('[data-pk]'); if (pk) load(pk.dataset.pk);
  });
  box.addEventListener('dblclick', e => { const r = e.target.closest('.pk-row[data-pk]'); if (r && !r.classList.contains('dim')) analyze(r.dataset.pk); });
  $('#pkClose').onclick = close;
  $('#pkGo').onclick = () => load($('#pkPath').value.trim());
  $('#pkPath').addEventListener('keydown', e => { if (e.key === 'Enter') load($('#pkPath').value.trim()); });
  $('#pkUp').onclick = () => data && data.parent && load(data.parent);
  $('#pkHidden').onchange = () => data && draw();
  $('#pkOpen').onclick = () => analyze(cur || $('#pkPath').value.trim());
  $('#pkNative').onclick = async () => {
    const b = $('#pkNative'); b.disabled = true; b.textContent = 'Waiting for dialog…';
    try { const j = await (await fetch('/api/pick?path=' + encodeURIComponent(cur || ''))).json();
      if (j.path) analyze(j.path); else if (j.error) $('#pkHere').innerHTML = `<span class="warn">${esc(j.error)}</span>`; }
    catch (e) { $('#pkHere').innerHTML = `<span class="warn">${esc(e.message)}</span>`; }
    finally { b.disabled = false; b.innerHTML = 'Browse&hellip;'; }
  };
  $('#openBtn').onclick = open;
  return { open, close, get isOpen() { return !box.hidden; } };
})();

// ------------------------------------------------------------------ static mode: open a folder without the server
// Two ways in: (1) pick a folder -> the browser reads the .py files and runs the same Python analyzer
// in-page (Pyodide / WebAssembly); nothing is uploaded. (2) type a path -> hand off to the local app.
const Local = (() => {
  const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
  const SKIP = new Set(D.meta.skip_dirs || ['.git', '.venv', 'venv', '__pycache__', 'node_modules', 'site-packages']);
  const PATH_KEY = 'codeflow.lastPath', APP_PORT = 8347;
  let py = null;
  const status = (msg, cls = '') => { const s = $('#lcStatus'); if (s) { s.className = 'lc-status ' + cls; s.innerHTML = msg; } };
  const isAbs = p => /^([A-Za-z]:[\\/]|\/|\\\\)/.test(p || '');
  const lastPath = () => { try { return localStorage.getItem(PATH_KEY) || ''; } catch (_) { return ''; } };
  function show() {
    $('#pkBody').innerHTML = `
      <div class="lc">
        <section>
          <h4>Folder path</h4>
          <div class="pk-bar" style="padding:0">
            <input id="lcPath" spellcheck="false" placeholder="e.g. D:\\Project\\RangeBreak" value="${esc(lastPath())}">
            <button class="b" id="lcGo" title="Open this path in the local codeflow app">Open path</button>
          </div>
          <p class="muted">Paste any path. If the local app is running it opens directly; otherwise pick the same folder below and the path is used for “Open in VS Code” links.</p>
        </section>
        <section>
          <h4>Or choose the folder</h4>
          <div class="actions" style="margin:0 0 6px">
            <button class="b pri" id="lcChoose">Choose folder…</button>
            <input type="file" id="lcInput" webkitdirectory multiple hidden>
          </div>
          <p class="muted">Your browser reads the <span class="mono">.py</span> files and analyzes them on this page — nothing is uploaded.
            The first time, it downloads the Python runtime (~10&nbsp;MB, then cached).</p>
        </section>
        <label class="pk-ex">Skip folders <input id="lcEx" placeholder="e.g. tests, migrations" spellcheck="false"></label>
        <div id="lcStatus" class="lc-status"></div>
      </div>`;
    $('#lcEx').value = (D.meta.exclude || []).join(', ');
    $('#lcGo').onclick = openPath;
    $('#lcPath').addEventListener('keydown', e => { if (e.key === 'Enter') openPath(); });
    $('#lcChoose').onclick = choose;
    $('#lcInput').onchange = e => fromInput(e.target.files);
    setTimeout(() => $('#lcPath').focus(), 30);
  }
  const excludes = () => $('#lcEx').value.split(',').map(s => s.trim()).filter(Boolean);
  const savePath = p => { try { localStorage.setItem(PATH_KEY, p); } catch (_) {} };
  async function openPath() {
    const p = $('#lcPath').value.trim().replace(/^"(.*)"$/, '$1');
    if (!p) return status('Type a folder path first.', 'warn');
    if (!isAbs(p)) return status('Use a full path such as <span class="mono">D:\\Project\\RangeBreak</span>.', 'warn');
    savePath(p);
    const ex = excludes().join(',');
    const query = '/?path=' + encodeURIComponent(p) + (ex ? '&exclude=' + encodeURIComponent(ex) : '');
    status('Looking for the local codeflow app…');
    // image probe: needs no CORS, so it works from a file:// page; other apps on these ports fail the probe
    const probe = port => new Promise(ok => {
      const img = new Image(), t = setTimeout(() => ok(null), 2500);
      img.onload = () => { clearTimeout(t); ok(port); };
      img.onerror = () => { clearTimeout(t); ok(null); };
      img.src = `http://127.0.0.1:${port}/api/ping.gif?${Date.now()}`;
    });
    const found = (await Promise.all([0, 1, 2, 3, 4].map(i => probe(APP_PORT + i)))).find(Boolean);
    const url = `http://127.0.0.1:${found || APP_PORT}${query}`;
    if (found) { status('Opening in the local app…'); location.href = url; return; }
    status(`Couldn't find the local codeflow app, and a web page can't read <span class="mono">${esc(p)}</span> on its own.<br>
      • Click <b>Choose folder…</b> and select that folder (the path above is kept for “Open in VS Code” links), or<br>
      • start the app — double-click <span class="mono">codeflow.bat</span> in the codeflow folder — then <a class="lnk" href="${esc(url)}">open this path in the app</a>.`, 'warn');
  }
  async function choose() {
    if (window.showDirectoryPicker) {
      let dir;
      try { dir = await window.showDirectoryPicker({ id: 'codeflow', mode: 'read' }); }
      catch (e) { if (e && e.name === 'AbortError') return; return $('#lcInput').click(); }
      try {
        const files = [], ex = new Set(excludes());
        await walk(dir, '', files, ex);
        return run(dir.name, files);
      } catch (e) { return status('Could not read the folder: ' + esc(e.message || e), 'warn'); }
    }
    $('#lcInput').click();                                  // Firefox / older browsers
  }
  async function walk(dir, prefix, out, ex) {
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'directory') {
        if (SKIP.has(name) || ex.has(name) || name.startsWith('.')) continue;
        await walk(h, prefix + name + '/', out, ex);
      } else if (name.endsWith('.py')) {
        const f = await h.getFile();
        if (f.size < 2e6) out.push([prefix + name, await f.text()]);
        if (out.length % 25 === 0) status(`Reading… ${out.length} Python files`);
      }
    }
  }
  async function fromInput(list) {
    const ex = new Set(excludes()), files = [];
    let root = '';
    for (const f of list) {
      const parts = (f.webkitRelativePath || f.name).split('/');
      root = root || parts[0];
      if (!parts[parts.length - 1].endsWith('.py') || f.size >= 2e6) continue;
      if (parts.slice(1, -1).some(p => SKIP.has(p) || ex.has(p) || p.startsWith('.'))) continue;
      files.push([parts.slice(1).join('/'), await f.text()]);
    }
    return run(root || 'project', files);
  }
  function loadScript(src) {
    return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('could not download ' + src)); document.head.appendChild(s); });
  }
  async function runtime() {
    if (py) return py;
    status('Loading Python in the browser… (first time only, ~10 MB)');
    if (!window.loadPyodide) await loadScript(PYODIDE + 'pyodide.js');
    py = await window.loadPyodide({ indexURL: PYODIDE });
    return py;
  }
  async function run(rootName, files) {
    if (!files.length) return status(`No Python files found in <span class="mono">${esc(rootName)}</span> (after skipping ${[...SKIP].slice(0, 4).join(', ')}…).`, 'warn');
    $('#lcChoose').disabled = true;
    try {
      const p = await runtime();
      status(`Analyzing ${files.length} Python files from <span class="mono">${esc(rootName)}</span>…`);
      const safe = rootName.replace(/[^\w.\- ]/g, '_') || 'project';
      p.runPython("import shutil; shutil.rmtree('/work', ignore_errors=True)");
      for (const [rel, text] of files) {
        const full = `/work/${safe}/${rel}`;
        p.FS.mkdirTree(full.slice(0, full.lastIndexOf('/')));
        p.FS.writeFile(full, text);
      }
      p.FS.mkdirTree('/cf');
      p.FS.writeFile('/cf/cf_analyzer.py', JSON.parse(document.getElementById('cf-analyzer').textContent));
      const typed = ($('#lcPath').value || '').trim();
      p.globals.set('CF_ROOT', `/work/${safe}`);
      p.globals.set('CF_EXCLUDE', excludes().join(','));
      p.globals.set('CF_DISPLAY', isAbs(typed) && typed.replace(/[\\/]+$/, '').split(/[\\/]/).pop() === rootName ? typed : rootName);
      const out = p.runPython(`
import sys, json, importlib
sys.path.insert(0, '/cf')
import cf_analyzer
importlib.reload(cf_analyzer)
_p = cf_analyzer.Project(CF_ROOT, exclude=[x for x in CF_EXCLUDE.split(',') if x])
_d = _p.to_json()
_d['meta']['root'] = CF_DISPLAY
_d['meta']['browser'] = True
json.dumps(_d)`);
      relaunch(JSON.parse(out));
    } catch (e) {
      status('Analysis failed: ' + esc(e.message || e) + '<br>If you are offline, use the local app instead (<span class="mono">codeflow.bat</span>).', 'warn');
      $('#lcChoose').disabled = false;
    }
  }
  function relaunch(data) {
    const TAG = '<script id="cf-data" type="application/json">';
    const a = PRISTINE.indexOf(TAG), b = PRISTINE.indexOf('<\/script>', a);
    const json = JSON.stringify(data).replace(/<\//g, '<\\/');
    const html = PRISTINE.slice(0, a + TAG.length) + json + PRISTINE.slice(b);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
    document.open(); document.write(html); document.close();
  }
  return { show, run, isAbs };
})();
window.__codeflowLocal = Local;       // used by tests

// ------------------------------------------------------------------ detected stack
const FRAMEWORKS = { fastapi: 'FastAPI', flask: 'Flask', django: 'Django', starlette: 'Starlette', celery: 'Celery', click: 'Click',
  typer: 'Typer', pytest: 'pytest', pandas: 'pandas', numpy: 'NumPy', polars: 'Polars', sqlalchemy: 'SQLAlchemy', pydantic: 'Pydantic',
  requests: 'requests', httpx: 'httpx', aiohttp: 'aiohttp', uvicorn: 'Uvicorn', streamlit: 'Streamlit', langchain: 'LangChain',
  langgraph: 'LangGraph', openai: 'OpenAI', anthropic: 'Anthropic', torch: 'PyTorch', tensorflow: 'TensorFlow', sklearn: 'scikit-learn',
  boto3: 'AWS boto3', pyarrow: 'PyArrow', kiteconnect: 'Kite Connect', yfinance: 'yfinance', matplotlib: 'Matplotlib', plotly: 'Plotly' };
function buildDetected() {
  const libs = D.meta.libraries || {}, names = Object.keys(libs);
  const kinds = {}; entries.forEach(q => { const k = F[q].entry.kind; kinds[k] = (kinds[k] || 0) + 1; });
  const label = { route: 'route', main: 'script', cli: 'CLI command', task: 'task', test: 'test' };
  const summary = Object.entries(kinds).map(([k, n]) => `${n} ${label[k] || k}${n === 1 ? '' : 's'}`).join(' · ');
  const fw = names.filter(n => FRAMEWORKS[n]), other = names.filter(n => !FRAMEWORKS[n]);
  $('#detected').innerHTML = !ALL.length ? '<p class="empty-note">Open a folder to start.</p>' :
    `${summary ? `<div class="subh">${esc(summary)}</div>` : ''}
     ${names.length ? `<div class="chips">${fw.map(n => `<span class="chip lib fw" data-lib="${esc(n)}" title="used in ${libs[n].length} module(s)">${esc(FRAMEWORKS[n])}</span>`).join('')}${other.map(n => `<span class="chip lib" data-lib="${esc(n)}" title="used in ${libs[n].length} module(s)">${esc(n)}</span>`).join('')}</div>` : '<p class="empty-note">No third-party imports.</p>'}`;
  $$('#detected [data-lib]').forEach(c => c.onclick = () => panelLibrary(c.dataset.lib));
}
function panelLibrary(name) {
  const mods = (D.meta.libraries || {})[name] || [];
  const alias = new RegExp('^' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\.|$)');
  const users = ALL.filter(q => (externals[q] || []).some(c => alias.test(c.text))).slice(0, 60);
  panel(`<div class="kicker">third-party package</div><h2 class="mono">${esc(FRAMEWORKS[name] || name)}</h2>
    <p class="muted">Imported by ${mods.length} module${mods.length === 1 ? '' : 's'}.</p>
    <div class="chips">${mods.map(m => `<a class="chip lnk" data-mod="${esc(m)}">${esc(m)}</a>`).join('')}</div>
    <h4>Functions calling <span class="mono">${esc(name)}.*</span> directly (${users.length})</h4>
    ${fnList(users.map(q => ({ q, meta: uniq(externals[q].filter(c => alias.test(c.text)).map(c => c.text)).slice(0, 3).join(', ') })), 'None found (it may be used through an alias such as pd / np).')}`);
}

// ------------------------------------------------------------------ boot
const st = D.meta.stats;
$('#proj').textContent = D.meta.name || 'Open folder';
$('#openBtn').title = (D.meta.root ? D.meta.root + '\n' : '') + 'Open another folder (O)';
buildDetected();
$('#stats').textContent = `${st.modules} modules · ${st.functions} functions · ${st.classes} classes · ${st.internal_calls} project calls · ${st.lines.toLocaleString()} lines · ${st.elapsed_ms} ms`;
$('#stats').title = `${D.meta.root}\ngenerated ${D.meta.generated} · codeflow ${D.meta.version}`;
document.title = D.meta.name ? `codeflow · ${D.meta.name}` : 'codeflow · open a folder';
if (D.meta.landing) $('#stats').textContent = 'no folder open';
buildSide();
// default focus: the non-test entry point that reaches the most code
function reach(q) { const seen = new Set([q]), st = [q]; while (st.length && seen.size < 2000) for (const c of callees[st.pop()] || []) if (!seen.has(c.to)) { seen.add(c.to); st.push(c.to); } return seen.size; }
const starts = entries.filter(q => F[q].entry.kind !== 'test');
S.focus = (starts.length ? starts : ALL).map(q => [reach(q), q]).sort((a, b) => b[0] - a[0] || a[1].localeCompare(b[1]))
  .map(x => x[1])[0] || null;
readHash();
render(false);
if (D.meta.landing) {
  panel(`<div class="kicker">welcome</div><h2>Pick a project folder</h2>
    <p>codeflow reads every <span class="mono">.py</span> file in the folder (without running anything) and shows how functions call each other and how values move between them.</p>
    ${D.meta.message ? `<p class="warn">${esc(D.meta.message)}</p>` : ''}
    <p class="muted">Folders like <span class="mono">.venv</span>, <span class="mono">__pycache__</span> and <span class="mono">node_modules</span> are skipped automatically.</p>`);
  Picker.open();
}
})();
</script>
