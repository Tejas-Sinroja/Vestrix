[build-system]
requires = ["setuptools>=77"]   # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[project]
name = "vestrix"
dynamic = ["version"]            # single source of truth: VERSION in vestrix/analyzer.py
description = "Interactive call-graph and data-flow explorer for Python codebases"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tejas Sinroja" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Tejas-Sinroja/Vestrix"
Changelog = "https://github.com/Tejas-Sinroja/Vestrix/blob/main/CHANGELOG.md"

[project.scripts]
vestrix = "vestrix.cli:main"

[tool.setuptools]
packages = ["vestrix"]

[tool.setuptools.dynamic]
version = { attr = "vestrix.analyzer.VERSION" }

[tool.setuptools.package-data]
vestrix = ["viewer.html"]
