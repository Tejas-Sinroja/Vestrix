name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python -m codeflow --version
          python -m codeflow build examples/sample_shop -o demo.html
          python -m codeflow trace examples/sample_shop checkout_endpoint body --limit 5
      - name: Changelog has a section for the current version
        run: python scripts/release.py notes "$(python scripts/release.py current)"
        shell: bash
