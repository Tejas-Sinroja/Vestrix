name: Release

# Runs when a version tag is pushed (python scripts/release.py bump … --push does this).
# 1. build + verify  ->  2. GitHub Release (wheel, sdist, demo page)  ->  3. PyPI via Trusted Publishing (no tokens)
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match vestrix VERSION
        run: python scripts/release.py check-tag "$GITHUB_REF_NAME"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/vx && /tmp/vx/bin/pip install dist/*.whl
          /tmp/vx/bin/vestrix --version
          /tmp/vx/bin/vestrix cycles examples/sample_shop

      - name: Demo page
        run: |
          mkdir -p demo
          python -m vestrix build examples/sample_shop -o "demo/vestrix-demo-$GITHUB_REF_NAME.html"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes from CHANGELOG
        run: python scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/dist/* artifacts/demo/* \
            --title "Vestrix $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vestrix/
    permissions:
      id-token: write            # OIDC token for PyPI Trusted Publishing; no secrets involved
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
