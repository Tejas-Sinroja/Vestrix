name: Release

# Runs when a version tag is pushed (python scripts/release.py bump … --push does this).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match codeflow VERSION
        run: python scripts/release.py check-tag "$GITHUB_REF_NAME"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel, sdist and demo page
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m codeflow build examples/sample_shop -o "dist/codeflow-demo-$GITHUB_REF_NAME.html"
          ls -l dist

      - name: Release notes from CHANGELOG
        run: python scripts/release.py notes "$GITHUB_REF_NAME" > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "codeflow $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
